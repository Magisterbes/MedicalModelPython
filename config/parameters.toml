# MedicalModel2024 Python — TOML Configuration
# Equivalent to C# parameters.txt

[simulation]
years_to_simulate = 30
init_population = 100000
unreal_life_length = 110

[data]
data_dir = "data"
# Fallback data files, used only when the UI is left at "(default from config)".
# The named datasets offered in the UI are declared in data/datasets.json, which
# lists each aggregate/staging pair together (see the guide, Appendix A).
train_data_filename = "globocan_colorectum_usa_agg.csv"
train_staging_data_filename = "globocan_colorectum_usa_ind.csv"

[staging]
stage_distribution_length = 4

[hazards]
diagnose_hazard_spec = "piecewise, -1@-11.9;0@0.01;40@0.28;50@-0.11;60@-0.1;70@-0.1"
cancer_death_hazard_spec = "exp, 1"

[gompertz]
reduced_gompertz = [0.1, 0.3, 0.1, 0.1]

[lead_time]
lead_time_by_stage_means = [1.0, 3.0, 4.0, 5.0]

[natural_history]
reoccurrence_probability = 0.2
treatment_mortality_adjustment = 1.0

[treatment]
treatment_efficiency = [0.7, 0.3, 0.2, 0.2]
complications = [0.1]
age_cure_constants = [1.0, 0.9, 0.5, 0.3, 0.1]
# Odds ratio applied to the cure odds of an aggressive tumour, per stage I..IV.
# > 1 = an aggressive tumour is more likely to be cured, < 1 = less likely.
# Default 0.667: aggressive tumours are moderately harder to cure (as expected
# clinically). Set by hand: it is not estimated from data, because the staging
# file has no treatment-outcome column. A scalar entered in the UI is expanded
# to all stages.
aggressiveness_cure_odds_ratio = [0.667, 0.667, 0.667, 0.667]

[risk_factors]
# Not currently used in simulation core (defined for future use)
factors_rr = { Smoking = 1.1, Obesity = 1.05, Activity = 0.95 }
age_irrelevant_factors_rr = { Gene = 1.05 }
factor_age_correction = [0.1, 2.0]

[screening]
screening_date = 10
start_age = 50
finish_age = 60
frequency = 2
selected_test = 70
participation_rate = 0.5
test_parameters = [50, 60, 70, 80]
test_tp = [0.6, 0.7, 0.9, 0.95]
test_fp = [0.05, 0.07, 0.1, 0.15]

[economics]
test_per_person_price = 1.0
screening_price = 1.0
stage_treatment_price = [1.0, 2.0, 3.0, 4.0]
complications_price = 1.0
reoccurrence_cost = 1.0