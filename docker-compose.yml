services:
  web:
    build:
      context: .
    image: med_flask_app:latest
    container_name: flask_tutorial
    ports:
      - "5000:5000"
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
    # Persist results, fitted parameters and uploaded datasets on the host.
    volumes:
      - ./output:/app/output
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
